# The MCP environment blocks for the Hermes seat (docs/design/hermes-seat.md §6.1, Codex C-M4). The launcher copies
# mcp_env_common plus exactly one of mcp_env_scratch / mcp_env_live into the template's `env:` (indented six spaces).
# The two phases are mutually exclusive: scratch has a local store and no Worker; live has the Worker and no local store.
# Values in ${…} resolve from the profile .env at connect time and never enter the terminal's environment.
mcp_env_common:
  RETRACE_ACTOR: hermes
  RETRACE_PROJECT: retrace
  RETRACE_ON_BEHALF_OF: jordansboxing@gmail.com
  RETRACE_ACTOR_MODEL: "${RETRACE_ACTOR_MODEL}"
  RETRACE_ACTOR_MODEL_SOURCE: harness-config
mcp_env_scratch:
  RETRACE_DB: "{{PROFILE}}/run/scratch-{{DATE}}.sqlite"
mcp_env_live:
  # The Worker of record: RETRACE_PUBLIC_URL in apps/worker/wrangler.toml (Worker name "retrace-api"). Change it there first.
  RETRACE_URL: "https://retrace-api.slcwitit.workers.dev"
  RETRACE_TOKEN: "${RETRACE_TOKEN_HERMES}"
  RETRACE_PRODUCER_KEY_FILE: "${RETRACE_PRODUCER_KEY_FILE_HERMES}"
