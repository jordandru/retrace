# Provider profile for the Retrace Worker (the ledger), for the OpenShell seat `claude-code-openshell`.
# Design: docs/design/openshell-seat.md §2.2.3. Import on the PC's gateway:
#   openshell profile lint   -f sandbox/openshell/profiles/retrace-worker.yaml
#   openshell profile import -f sandbox/openshell/profiles/retrace-worker.yaml --global
#
# One credential, two environment names. The seat's MCP server (`retrace-mcp`) reads RETRACE_TOKEN; the git hook reads
# RETRACE_HOOK_TOKEN first (packages/mcp-server/src/git-hook.ts, resolveHookToken), which bypasses the `.retrace.json`
# `credential` lookup that would otherwise throw in a sandbox with no credentials file. Both names carry the same placeholder.
# The proxy substitutes the real token only in requests to the Worker's host, as `authorization: Bearer <token>`
# (packages/mcp-server/src/remote-store.ts). No other process and no other host sees it.
#
# Client binaries:   node (retrace-mcp and the hook are node programs installed under /usr/local/lib/node_modules/@retrace-dev)
#                    and curl (the seat's raw verification reads, GET /events/<id>, agent-rules 15).
# Credential scope:  RETRACE_TOKEN / RETRACE_HOOK_TOKEN, bearer `authorization` header, retrace-api.slcwitit.workers.dev only.
# Smoke test (probe Q1): openshell sandbox exec -n <sandbox> -- \
#                      curl -s -o /dev/null -w '%{http_code}\n' -H "authorization: Bearer $RETRACE_TOKEN" \
#                        https://retrace-api.slcwitit.workers.dev/projects/retrace/head        # 200; 401 without the header

id: retrace-worker
display_name: Retrace Worker
description: The Retrace ledger (Cloudflare Worker) for one pinned seat credential
category: other
inference_capable: false
credentials:
  - name: token
    description: Retrace seat bearer token (pinned, keyless)
    env_vars: [RETRACE_TOKEN, RETRACE_HOOK_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [token]
endpoints:
  - host: retrace-api.slcwitit.workers.dev
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/local/bin/node
  - /usr/local/lib/node_modules/@retrace-dev/**
  - /usr/bin/curl
