name = "retrace-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "retrace-db"
database_id = "ae8ebc52-9784-4109-b421-f63676972dfe"

# Set with: wrangler secret put RETRACE_TOKEN
# [vars]
# RETRACE_TOKEN = "dev-only-token"

[vars]
# Who holds RETRACE_TOKEN; owner-only actions (DELETE /projects/:p) are audited as this human instead of system/worker
RETRACE_OWNER = "jordansboxing@gmail.com"
# RETRACE_TRAILER_POLICY is unset here on purpose (defaults to off in the Worker). Do not set enforce
# until every git hook is retrace-producer-sig/2; Jordan deploys after this PR merges.
# HMAC-covered repository.full_name → Retrace project. Query ?project= is ignored (audit 2026-08-30).
RETRACE_GITHUB_PROJECTS = "{\"jordandru/retrace\":\"retrace\",\"jordandru/slc-wit-it\":\"boxing-rpg\"}"
# Explicit opt-in: checkpoint contents include project metadata and are published to the public Rekor log.
# Missing or [] means the hourly cron publishes nothing; never infer this list from D1.
RETRACE_CHECKPOINT_PROJECTS = "[\"retrace\"]"
# Reconciliation phase B: seal every pushed commit a second time from GitHub's HMAC-verified push delivery (key gh:push:…).
RETRACE_GITHUB_PUSH = "1"
# The experimental Streamable HTTP audit endpoint at /mcp. LIT by Jordan's decision 2026-09-03 (pilot parked on an
# upstream OpenClaw tool-delivery bug — see memory retrace-openclaw-pilot-findings; endpoint itself passed Copilot's
# security review). Kill switch — remove or set 0 and deploy to go dark.
RETRACE_MCP_ENABLED = "1"
# Makes the /mcp host/origin checks bite (they are no-ops without an expected origin).
RETRACE_PUBLIC_URL = "https://retrace-api.slcwitit.workers.dev"

# Hourly head checkpoints witnessed in Rekor (roadmap rung 2); handler = `scheduled` in src/index.ts
[triggers]
crons = ["7 * * * *"]

# Workers Logs (Workers Paid since 2026-09-06). Invocation logs + console output are retained by Cloudflare so a 5xx can
# be read by its ref instead of inferred from timing. head_sampling_rate 1 = every request at this traffic level.
[observability]
enabled = true
head_sampling_rate = 1
