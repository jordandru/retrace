<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Retrace</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --line: #2a2f3a; --text: #e6e8ee; --muted: #8b93a7;
    --human: #f2a93b; --agent: #5aa9ff; --system: #9aa3b5; --ok: #3ccb7f; --bad: #ff5c6c; --accent: #c7b6ff;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f7fa; --panel: #ffffff; --panel-2: #f0f2f6; --line: #dfe3ea; --text: #16181d; --muted: #616a7d;
      --human: #c77800; --agent: #1f6fe0; --system: #6b7385; --ok: #178f4f; --bad: #d1303f; --accent: #6b4fd8; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; letter-spacing: .04em; }
  header h1 span { color: var(--accent); }
  select, input, button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  input { min-width: 160px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #111; border-color: transparent; font-weight: 600; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); background: var(--panel-2); }
  .badge.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .badge.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 0; height: calc(100vh - 53px); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } #detail { border-left: 0; border-top: 1px solid var(--line); } }
  #timeline { overflow: auto; padding: 16px 20px 40px; }
  #detail { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 16px; }
  .legend { display: flex; gap: 14px; color: var(--muted); font-size: 12px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
  .legend .dot.human { background: var(--human); } .legend .dot.agent { background: var(--agent); } .legend .dot.system { background: var(--system); }
  .day { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin: 18px 0 8px 0; }
  .ev { display: grid; grid-template-columns: 64px 18px 1fr; gap: 10px; align-items: start; padding: 8px 8px; border-radius: 8px; cursor: pointer; position: relative; }
  .ev:hover { background: var(--panel-2); }
  .ev.sel { background: var(--panel-2); outline: 1px solid var(--accent); }
  .ev .t { color: var(--muted); font-family: var(--mono); font-size: 12px; padding-top: 2px; }
  .ev .rail { position: relative; height: 100%; }
  .ev .rail::before { content: ""; position: absolute; left: 8px; top: -10px; bottom: -14px; width: 2px; background: var(--line); }
  .ev .node { position: absolute; left: 3px; top: 3px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--bg); box-shadow: 0 0 0 1px var(--line); }
  .ev.human .node { background: var(--human); } .ev.agent .node { background: var(--agent); border-radius: 3px; } .ev.system .node { background: var(--system); }
  .ev .who { font-weight: 600; }
  .ev.human .who { color: var(--human); } .ev.agent .who { color: var(--agent); } .ev.system .who { color: var(--system); }
  .ev .verb { color: var(--accent); }
  .ev .art { font-family: var(--mono); font-size: 12.5px; }
  .ev .why { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .ev .link { color: var(--muted); font-size: 11px; }
  .chip { display: inline-block; font-family: var(--mono); font-size: 11px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; margin-right: 4px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  #detail h2 { font-size: 14px; margin: 0 0 8px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .08em; }
  .kv { display: grid; grid-template-columns: 62px 1fr; gap: 6px 10px; margin-bottom: 14px; }
  .kv .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
  .kv .v { word-break: break-word; }
  .kv .v.mono { font-family: var(--mono); font-size: 12px; }
  pre { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font-family: var(--mono); font-size: 12px; overflow: auto; max-height: 240px; margin: 4px 0 0; white-space: pre-wrap; }
  .why-chain { border-left: 2px solid var(--line); padding-left: 10px; margin: 6px 0 14px 4px; }
  .why-chain .step { margin: 6px 0; font-size: 13px; }
  .why-chain .step .who { font-weight: 600; }
  .why-chain .step.human .who { color: var(--human); } .why-chain .step.agent .who { color: var(--agent); }
  .why-chain .step .arrow { color: var(--muted); font-size: 11px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .stat { display: flex; gap: 16px; color: var(--muted); font-size: 12px; margin-bottom: 8px; flex-wrap: wrap; }
  .stat b { color: var(--text); font-weight: 600; }
  #conn { display: none; gap: 8px; align-items: center; }
  #conn.open { display: flex; }
  .hash { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>RE<span>TRACE</span></h1>
  <select id="project" title="Project"></select>
  <input id="q" placeholder="search intent, artifact, tool…" />
  <select id="ftype"><option value="">humans + agents</option><option value="human">humans</option><option value="agent">agents</option><option value="system">system</option></select>
  <select id="faction"><option value="">any action</option></select>
  <span id="verify" class="badge"><span class="dot"></span><span>verifying…</span></span>
  <span id="sharedBadge" class="badge" style="display:none" title="Read-only shared view">🔗 shared view</span>
  <button id="report" title="Printable report (save as PDF)">Report</button>
  <button id="export" title="Download signed JSON bundle">Export</button>
  <button id="share" title="Create a read-only share link">Share</button>
  <button id="refresh" title="Reload">↻</button>
  <button id="toggleConn" title="Connection settings">⚙</button>
  <span id="conn"><input id="apiUrl" placeholder="API URL (blank = same origin)" /><input id="apiTok" placeholder="token" type="password" /><button id="connect" class="primary">Connect</button><button id="loadJson">Load JSON…</button><input type="file" id="file" accept="application/json" style="display:none" /></span>
</header>
<div id="shareDlg" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;align-items:center;justify-content:center">
  <div style="background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(520px,92vw)">
    <h3 style="margin:0 0 10px;font-size:15px">Create read-only share link</h3>
    <div class="link" style="margin-bottom:8px">Anyone with the link can view (not edit) the events in scope, verify the chain, and download the signed export / report.</div>
    <div style="display:grid;gap:8px">
      <label>Scope <select id="shScope"><option value="project">whole project</option><option value="artifact">current artifact filter</option></select></label>
      <label>Label <input id="shLabel" placeholder="e.g. Jab counter — client review" style="width:100%"></label>
      <label>Expires <select id="shExp"><option value="">never</option><option value="7">7 days</option><option value="30">30 days</option><option value="90">90 days</option></select></label>
      <div id="shResult" class="link" style="word-break:break-all"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button id="shCancel">Close</button><button id="shCreate" class="primary">Create link</button></div>
    </div>
  </div>
</div>
<main>
  <section id="timeline"><div class="empty">Loading…</div></section>
  <aside id="detail"><div class="empty">Select an event to see who / what / when / where / why / how.</div></aside>
</main>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const state = { events: [], project: null, projects: [], sel: null, filterArtifact: null, filterActor: null, verify: null, offline: false };
  const params = new URLSearchParams(location.search);
  let apiBase = params.get("api") ?? "";
  let token = params.get("token") ?? "";
  $("#apiUrl").value = apiBase; $("#apiTok").value = token;
  // Shared mode: /s/<id> → all reads go through /s/<id>/*, scope locked server-side
  const shareMatch = location.pathname.match(/\/s\/([^/]+)/);
  const shareId = shareMatch ? shareMatch[1] : null;
  if (shareId) {
    document.body.classList.add("shared");
    $("#sharedBadge").style.display = "";
    ["#share", "#toggleConn", "#project"].forEach((s) => ($(s).style.display = "none"));
  }
  const P = {
    projects: () => shareId ? api(`/s/${shareId}/meta`).then((m) => [m.project]) : api("/projects"),
    events: (p) => shareId ? api(`/s/${shareId}/events?limit=5000`) : api(`/projects/${encodeURIComponent(p)}/events?limit=5000`),
    verify: (p) => shareId ? api(`/s/${shareId}/verify`) : api(`/projects/${encodeURIComponent(p)}/verify`),
    exportUrl: (p, art) => shareId ? `${apiBase}/s/${shareId}/export` : `${apiBase}/projects/${encodeURIComponent(p)}/export?${new URLSearchParams({ ...(art ? { artifact_id: art } : {}), ...(token ? { token } : {}) })}`,
    reportUrl: (p, art) => shareId ? `${apiBase}/s/${shareId}/report` : `${apiBase}/projects/${encodeURIComponent(p)}/report?${new URLSearchParams({ ...(art ? { artifact_id: art } : {}), ...(token ? { token } : {}) })}`,
  };

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtTime = (iso) => new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const fmtDay = (iso) => new Date(iso).toLocaleDateString([], { weekday: "short", year: "numeric", month: "short", day: "numeric" });
  const actorName = (a) => a.display_name || a.id;
  const actorTag = (a) => a.type === "agent" ? (a.model ? ` · ${a.model}` : " · agent") : a.type === "system" ? " · system" : "";
  const verbOf = (e) => e.action === "other" ? (e.action_detail || "acted on") : e.action;
  const artLabel = (a) => a.label || a.id;

  async function api(path) {
    const url = (apiBase || "") + path;
    const res = await fetch(url, { headers: token ? { authorization: `Bearer ${token}` } : {} });
    if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
    return res.json();
  }

  async function loadProjects() {
    state.projects = await P.projects();
    const sel = $("#project");
    sel.innerHTML = state.projects.map((p) => `<option>${esc(p)}</option>`).join("") || "<option value=''>(no projects yet)</option>";
    const want = params.get("project");
    state.project = state.projects.includes(want) ? want : state.projects[0] ?? null;
    if (state.project) sel.value = state.project;
  }

  async function loadEvents() {
    if (state.offline) return render();
    if (!state.project) { state.events = []; return render(); }
    const [events, verify] = await Promise.all([P.events(state.project), P.verify(state.project).catch(() => null)]);
    state.events = events; state.verify = verify;
    render();
  }

  function localVerifyBadge() {
    const b = $("#verify"); const v = state.verify;
    if (!v) { b.className = "badge"; b.lastElementChild.textContent = state.offline ? "offline snapshot" : "not verified"; return; }
    b.className = "badge " + (v.ok ? "ok" : "bad");
    b.lastElementChild.textContent = v.ok ? `chain intact · ${v.checked} events` : `chain BROKEN at #${v.first_bad_seq}`;
    b.title = v.reason || "";
  }

  function filtered() {
    const q = $("#q").value.trim().toLowerCase();
    const t = $("#ftype").value; const a = $("#faction").value;
    return state.events.filter((e) => {
      if (t && e.actor.type !== t) return false;
      if (a && e.action !== a) return false;
      if (state.filterArtifact && !e.artifacts.some((x) => x.id === state.filterArtifact)) return false;
      if (state.filterActor && e.actor.id !== state.filterActor) return false;
      if (q && !JSON.stringify(e).toLowerCase().includes(q)) return false;
      return true;
    });
  }

  function render() {
    localVerifyBadge();
    const acts = [...new Set(state.events.map((e) => e.action))].sort();
    const fa = $("#faction"); const cur = fa.value;
    fa.innerHTML = `<option value="">any action</option>` + acts.map((a) => `<option ${a === cur ? "selected" : ""}>${esc(a)}</option>`).join("");
    const list = filtered();
    const humans = new Set(state.events.filter((e) => e.actor.type === "human").map((e) => e.actor.id)).size;
    const agents = new Set(state.events.filter((e) => e.actor.type === "agent").map((e) => e.actor.id)).size;
    const arts = new Set(state.events.flatMap((e) => e.artifacts.map((a) => a.id))).size;
    let html = `<div class="stat"><span><b>${state.events.length}</b> events</span><span><b>${humans}</b> humans</span><span><b>${agents}</b> agents</span><span><b>${arts}</b> artifacts</span>` +
      (state.filterArtifact ? `<span>artifact: <span class="chip" data-clear="artifact">${esc(state.filterArtifact)} ✕</span></span>` : "") +
      (state.filterActor ? `<span>actor: <span class="chip" data-clear="actor">${esc(state.filterActor)} ✕</span></span>` : "") + `</div>`;
    html += `<div class="legend"><span><i class="dot human" style="display:inline-block"></i> human</span><span><i class="dot agent" style="display:inline-block;border-radius:2px"></i> agent</span><span><i class="dot system" style="display:inline-block"></i> system</span><span style="margin-left:auto">newest at bottom</span></div>`;
    if (!list.length) html += `<div class="empty">No events${state.events.length ? " match these filters" : " yet — log one with the MCP tool <code>retrace_log</code> or POST /events"}.</div>`;
    let lastDay = "";
    for (const e of list) {
      const day = fmtDay(e.timestamp);
      if (day !== lastDay) { html += `<div class="day">${esc(day)}</div>`; lastDay = day; }
      const MAX = 6; const shown = e.artifacts.slice(0, MAX); const extra = e.artifacts.length - shown.length;
      const arts = shown.map((a) => `<span class="chip" data-art="${esc(a.id)}" title="${esc(a.id)}">${esc(artLabel(a))}</span>`).join("") + (extra > 0 ? `<span class="chip" title="select the event to see all">+${extra} more</span>` : "");
      const where = e.location?.path || e.location?.url || e.location?.system || "";
      const how = e.method?.tool ? `via ${esc(e.method.tool)}` : "";
      html += `<div class="ev ${e.actor.type} ${state.sel === e.id ? "sel" : ""}" data-id="${esc(e.id)}">
        <div class="t">${fmtTime(e.timestamp)}<br><span class="link">#${e.seq}</span></div>
        <div class="rail"><div class="node"></div></div>
        <div>
          <div><span class="who" data-actor="${esc(e.actor.id)}">${esc(actorName(e.actor))}</span><span class="link">${esc(actorTag(e.actor))}${e.actor.on_behalf_of ? " · for " + esc(e.actor.on_behalf_of) : ""}</span> <span class="verb">${esc(verbOf(e))}</span> <span class="art">${arts}</span> <span class="link">${where ? "@ " + esc(where) + " " : ""}${how}</span></div>
          ${e.intent ? `<div class="why">${esc(e.intent)}</div>` : ""}
          ${e.caused_by ? `<div class="link">↳ caused by <a href="#" data-goto="${esc(e.caused_by)}">${esc(e.caused_by.slice(0, 16))}…</a></div>` : ""}
        </div></div>`;
    }
    $("#timeline").innerHTML = html;
    if (state.sel && !state.events.some((e) => e.id === state.sel)) state.sel = null;
    renderDetail();
  }

  function whyChain(id) {
    const byId = new Map(state.events.map((e) => [e.id, e]));
    const chain = []; const seen = new Set(); let cur = byId.get(id);
    while (cur && !seen.has(cur.id) && chain.length < 30) { seen.add(cur.id); chain.push(cur); cur = cur.caused_by ? byId.get(cur.caused_by) : null; }
    return chain;
  }
  function effects(id) { return state.events.filter((e) => e.caused_by === id); }

  function renderDetail() {
    const e = state.events.find((x) => x.id === state.sel);
    const d = $("#detail");
    if (!e) { d.innerHTML = `<div class="empty">Select an event to see who / what / when / where / why / how.</div>`; return; }
    const kv = (k, v, mono) => v ? `<div class="k">${k}</div><div class="v ${mono ? "mono" : ""}">${v}</div>` : "";
    const chain = whyChain(e.id).slice(1); const kids = effects(e.id);
    const parentMissing = e.caused_by && !state.events.some((x) => x.id === e.caused_by);
    const chainHtml = parentMissing ? `<div class="link" style="margin-bottom:12px">caused by <span class="mono">${esc(e.caused_by)}</span> — outside this view's scope</div>` : chain.length ? `<div class="why-chain">` + chain.map((c) => `<div class="step ${c.actor.type}"><span class="arrow">↳ because</span> <span class="who">${esc(actorName(c.actor))}</span> ${esc(verbOf(c))} ${esc(c.artifacts.map(artLabel).join(", "))}${c.intent ? ` — <i>${esc(c.intent)}</i>` : ""} <a href="#" data-goto="${esc(c.id)}" class="link">#${c.seq}</a></div>`).join("") + `</div>` : `<div class="link" style="margin-bottom:12px">no causal parent recorded — this is a root event</div>`;
    const kidsHtml = kids.length ? `<div class="why-chain">` + kids.map((c) => `<div class="step ${c.actor.type}"><span class="arrow">→ led to</span> <span class="who">${esc(actorName(c.actor))}</span> ${esc(verbOf(c))} ${esc(c.artifacts.map(artLabel).join(", "))} <a href="#" data-goto="${esc(c.id)}" class="link">#${c.seq}</a></div>`).join("") + `</div>` : "";
    d.innerHTML = `
      <h2>Event #${e.seq}</h2>
      <div class="kv">
        ${kv("Who", `<span style="color:var(--${e.actor.type});font-weight:600">${esc(actorName(e.actor))}</span> <span class="link">${esc(e.actor.type)}${e.actor.model ? " · " + esc(e.actor.model) : ""}${e.actor.version ? " " + esc(e.actor.version) : ""}${e.actor.on_behalf_of ? "<br>on behalf of " + esc(e.actor.on_behalf_of) : ""}</span>`)}
        ${kv("What", `<b>${esc(verbOf(e))}</b> ${e.artifacts.map((a) => `<span class="chip" data-art="${esc(a.id)}">${esc(artLabel(a))}</span>${a.kind && a.kind !== "file" ? `<span class="link">${esc(a.kind)}</span>` : ""}${a.derived_from?.length ? `<div class="link">derived from ${esc(a.derived_from.join(", "))}</div>` : ""}`).join(" ")}${e.change?.summary ? `<div>${esc(e.change.summary)}</div>` : ""}${e.change?.diff ? `<pre>${esc(e.change.diff)}</pre>` : ""}${e.change?.after_hash ? `<div class="hash">after ${esc(e.change.after_hash)}</div>` : ""}`)}
        ${kv("When", `${esc(new Date(e.timestamp).toLocaleString())}${e.duration_ms != null ? ` <span class="link">· ${e.duration_ms} ms</span>` : ""}<div class="link">received ${esc(new Date(e.received_at).toLocaleString())}</div>`)}
        ${kv("Where", e.location ? esc([e.location.system, e.location.environment, e.location.path || e.location.url, e.location.device].filter(Boolean).join(" · ")) : "")}
        ${kv("Why", `${e.intent ? esc(e.intent) : "<span class='link'>(no intent recorded)</span>"}`)}
        ${kv("How", e.method ? `${e.method.tool ? `<b>${esc(e.method.tool)}</b> ` : ""}${e.method.automated != null ? `<span class="link">${e.method.automated ? "automated" : "manual"}</span>` : ""}${e.method.instruction ? `<div class="link">instruction: ${esc(e.method.instruction)}</div>` : ""}${e.method.tokens != null ? `<div class="link">${e.method.tokens} tokens${e.method.cost_usd != null ? ` · $${e.method.cost_usd}` : ""}</div>` : ""}${e.method.params ? `<pre>${esc(JSON.stringify(e.method.params, null, 2))}</pre>` : ""}` : "")}
        ${kv("Tags", e.tags?.length ? e.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join("") : "")}
      </div>
      <h2>Causal chain</h2>${chainHtml}
      ${kids.length ? `<h2>Consequences</h2>${kidsHtml}` : ""}
      <h2>Integrity</h2>
      <div class="kv"><div class="k">id</div><div class="v mono">${esc(e.id)}</div><div class="k">hash</div><div class="v hash">${esc(e.hash)}</div><div class="k">prev</div><div class="v hash">${esc(e.prev_hash)}</div></div>
      <details><summary class="link">raw JSON</summary><pre>${esc(JSON.stringify(e, null, 2))}</pre></details>`;
  }

  // events
  document.addEventListener("click", (ev) => {
    const t = ev.target.closest("[data-art],[data-actor],[data-goto],[data-clear],.ev");
    if (!t) return;
    if (t.dataset.art) { state.filterArtifact = t.dataset.art; ev.stopPropagation(); return render(); }
    if (t.dataset.actor) { state.filterActor = t.dataset.actor; ev.stopPropagation(); return render(); }
    if (t.dataset.goto) { ev.preventDefault(); state.sel = t.dataset.goto; state.filterArtifact = null; state.filterActor = null; render(); document.querySelector(`.ev[data-id="${CSS.escape(state.sel)}"]`)?.scrollIntoView({ block: "center", behavior: "smooth" }); return; }
    if (t.dataset.clear) { if (t.dataset.clear === "artifact") state.filterArtifact = null; else state.filterActor = null; return render(); }
    if (t.classList.contains("ev")) { state.sel = t.dataset.id; render(); }
  });
  $("#project").addEventListener("change", (e) => { state.project = e.target.value; state.sel = null; state.filterArtifact = null; state.filterActor = null; loadEvents().catch(showErr); });
  ["#q", "#ftype", "#faction"].forEach((s) => $(s).addEventListener("input", render));
  $("#refresh").addEventListener("click", () => boot());
  $("#report").addEventListener("click", () => window.open(P.reportUrl(state.project, state.filterArtifact), "_blank"));
  $("#export").addEventListener("click", async () => {
    if (state.offline) { const blob = new Blob([JSON.stringify({ format: "retrace-export/1", scope: { project: state.project }, events: state.events }, null, 2)], { type: "application/json" }); return dl(blob, `${state.project}-events.json`); }
    const res = await fetch(P.exportUrl(state.project, state.filterArtifact), { headers: token ? { authorization: `Bearer ${token}` } : {} });
    dl(await res.blob(), `retrace-${state.project}${state.filterArtifact ? "-" + state.filterArtifact.replace(/[^\w.-]+/g, "_") : ""}.json`);
  });
  function dl(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
  $("#share").addEventListener("click", () => { $("#shScope").value = state.filterArtifact ? "artifact" : "project"; $("#shScope").querySelector('[value=artifact]').disabled = !state.filterArtifact; $("#shResult").textContent = ""; $("#shareDlg").style.display = "flex"; });
  $("#shCancel").addEventListener("click", () => ($("#shareDlg").style.display = "none"));
  $("#shCreate").addEventListener("click", async () => {
    const body = { artifact_id: $("#shScope").value === "artifact" ? state.filterArtifact : undefined, label: $("#shLabel").value.trim() || undefined, expires_in_days: Number($("#shExp").value) || undefined };
    try {
      const res = await fetch(`${apiBase}/projects/${encodeURIComponent(state.project)}/share`, { method: "POST", headers: { "content-type": "application/json", ...(token ? { authorization: `Bearer ${token}` } : {}) }, body: JSON.stringify(body) });
      const r = await res.json(); if (!res.ok) throw new Error(r.error || res.status);
      const u = r.url.startsWith("http") ? r.url : location.origin + r.url;
      $("#shResult").innerHTML = `Link: <a href="${esc(u)}" target="_blank">${esc(u)}</a> <button id="shCopy">copy</button><br>Report: <a href="${esc(u)}/report" target="_blank">${esc(u)}/report</a>${r.share.expires_at ? `<br>expires ${esc(new Date(r.share.expires_at).toLocaleString())}` : ""}`;
      $("#shCopy").addEventListener("click", () => navigator.clipboard?.writeText(u));
    } catch (e) { $("#shResult").textContent = "Failed: " + e.message; }
  });
  $("#toggleConn").addEventListener("click", () => $("#conn").classList.toggle("open"));
  $("#connect").addEventListener("click", () => { apiBase = $("#apiUrl").value.trim().replace(/\/$/, ""); token = $("#apiTok").value.trim(); state.offline = false; boot(); });
  $("#loadJson").addEventListener("click", () => $("#file").click());
  $("#file").addEventListener("change", async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const data = JSON.parse(await f.text());
    const events = Array.isArray(data) ? data : data.events ?? [];
    state.offline = true; state.events = events.sort((a, b) => a.seq - b.seq); state.verify = null;
    state.projects = [...new Set(events.map((x) => x.project))]; state.project = state.projects[0] ?? null;
    $("#project").innerHTML = state.projects.map((p) => `<option>${esc(p)}</option>`).join("");
    render();
  });
  function showErr(err) { $("#timeline").innerHTML = `<div class="empty">Could not load: ${esc(err.message)}<br><br>Open ⚙ to set the API URL / token, or load a JSON export.</div>`; $("#conn").classList.add("open"); }
  async function boot() { try { await loadProjects(); await loadEvents(); } catch (err) { showErr(err); } }
  boot();
  setInterval(() => { if (!state.offline && document.visibilityState === "visible") loadEvents().catch(() => {}); }, 15000);
})();
</script>
</body>
</html>
