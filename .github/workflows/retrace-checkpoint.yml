# Scheduled head checkpoint. A hash chain proves present events were not altered; a checkpoint committed to git
# proves the head existed at a point in time, so a later export that drops the tail is detectable
# (`retrace-export verify <bundle> --checkpoint .retrace/checkpoints.jsonl`, using the committed public JWK).
# This job takes a verified full export
# of the ledger, appends a signed checkpoint to .retrace/checkpoints.jsonl, and opens a pull request — a human merge
# is the witness, and the GitHub webhook logs that merge into the ledger, which is how the merge commit passes the gate.
#
# Secrets: RETRACE_CI_TOKEN (Worker credential that can GET; same as the gate) and RETRACE_CHECKPOINT_KEY (a private
# Ed25519 JWK used ONLY for checkpoints — never the Worker's signing key). Mint it with
#   RETRACE_SIGNING_KEY_FILE=~/.retrace/checkpoint-key.json node packages/mcp-server/dist/export-cli.js keygen --print-private
# and `gh secret set RETRACE_CHECKPOINT_KEY`.
#
# The pull request is pushed and opened as the `retrace-checkpoint` GitHub App, never with GITHUB_TOKEN: a PR created
# by github-actions[bot] has its `pull_request` workflow runs held for manual approval (GitHub, June 2026), so the
# required `gate` check would never run on its own. The App's bot login keeps the PR's `created` event a system actor
# in the ledger (a personal token would record the operator as opening it by hand). Configure once:
#   repo variable RETRACE_CHECKPOINT_APP_CLIENT_ID (the App's Client ID) and secret RETRACE_CHECKPOINT_APP_KEY (its PEM
#   private key) — see SETUP-GUIDE §4d. The job fails closed without them. GITHUB_TOKEN itself is read-only here.
name: retrace-checkpoint
on:
  schedule:
    - cron: "17 6 * * *"   # daily 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read   # the App token carries the write rights; GITHUB_TOKEN writes nothing
concurrency:
  group: retrace-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # the App token lives one hour; an overrun must fail clearly, not as a 401 at push time
    env:
      PROJECT: retrace
      CHECKPOINTS: .retrace/checkpoints.jsonl
    steps:
      - name: Require the retrace-checkpoint GitHub App credentials
        env:
          APP_CLIENT_ID: ${{ vars.RETRACE_CHECKPOINT_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.RETRACE_CHECKPOINT_APP_KEY }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::RETRACE_CHECKPOINT_APP_CLIENT_ID (repo variable) and RETRACE_CHECKPOINT_APP_KEY (secret) must be set; a PR opened with GITHUB_TOKEN would sit in action_required (SETUP-GUIDE 4d)" >&2
            exit 1
          fi
      - name: Mint a retrace-checkpoint GitHub App token (PRs it opens trigger retrace-gate)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RETRACE_CHECKPOINT_APP_CLIENT_ID }}
          private-key: ${{ secrets.RETRACE_CHECKPOINT_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-metadata: read
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0   # reconcile walks history since the last checkpoint commit
          token: ${{ steps.app.outputs.token }}   # the branch push below runs as the App
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Append a signed checkpoint from a verified full export
        id: cp
        env:
          RETRACE_URL: https://retrace-api.slcwitit.workers.dev
          RETRACE_TOKEN: ${{ secrets.RETRACE_CI_TOKEN }}
          RETRACE_SIGNING_KEY: ${{ secrets.RETRACE_CHECKPOINT_KEY }}
          RETRACE_ISSUER: retrace-checkpoint (GitHub Actions)
        run: |
          set -euo pipefail
          if [ -z "${RETRACE_SIGNING_KEY}" ]; then
            echo "::error::RETRACE_CHECKPOINT_KEY is not set; refusing to sign a checkpoint with a throwaway key" >&2
            exit 1
          fi
          set +e
          out=$(node packages/mcp-server/dist/export-cli.js checkpoint "$PROJECT" --out "$CHECKPOINTS" 2>&1)
          rc=$?
          set -e
          out=$(echo "$out" | grep -v ExperimentalWarning | grep -v 'trace-warnings' || true)
          echo "$out"
          if [ "$rc" -ne 0 ]; then echo "::error::export-cli checkpoint exited $rc" >&2; exit "$rc"; fi
          if echo "$out" | grep -q '^unchanged'; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! echo "$out" | grep -q '^appended head'; then echo "::error::checkpoint did not append" >&2; exit 1; fi
          line=$(tail -n 1 "$CHECKPOINTS")
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "seq=$(echo "$line" | jq -r .seq)" >> "$GITHUB_OUTPUT"
          echo "head=$(echo "$line" | jq -r '.head_hash[0:12]')" >> "$GITHUB_OUTPUT"
          echo "total=$(echo "$line" | jq -r .total_events)" >> "$GITHUB_OUTPUT"
          echo "signer=$(echo "$line" | jq -r '.signer.kid // "unsigned"')" >> "$GITHUB_OUTPUT"
          echo "issuer=$(echo "$line" | jq -r '.source.issuer_kid // "unsigned"')" >> "$GITHUB_OUTPUT"
      - name: Witness the new checkpoint in the Rekor transparency log
        if: steps.cp.outputs.changed == 'true'
        env:
          RETRACE_SIGNING_KEY: ${{ secrets.RETRACE_CHECKPOINT_KEY }}
        run: |
          set -euo pipefail
          node packages/mcp-server/dist/export-cli.js witness "$PROJECT" --checkpoints "$CHECKPOINTS" --witnesses .retrace/witnesses.jsonl
      - name: Reconcile git history against the ledger since the last checkpoint commit
        # docs/reconciliation-plan.md — capture windows per file, mis-attributed and missing commits. Runs on every
        # schedule whether or not the head moved; a failure is reported after the checkpoint PR is opened, never instead of it.
        id: rec
        continue-on-error: true
        env:
          RETRACE_URL: https://retrace-api.slcwitit.workers.dev
          RETRACE_TOKEN: ${{ secrets.RETRACE_CI_TOKEN }}
        run: |
          set -euo pipefail
          since=$(git log -1 --format=%H -- "$CHECKPOINTS")
          set +e
          node packages/mcp-server/dist/export-cli.js reconcile --repo . --since "$since" --gate 2>&1 | grep -v -e ExperimentalWarning -e trace-warnings | tee reconcile.txt
          rc=${PIPESTATUS[0]}
          set -e
          exit "$rc"
      - name: Open a pull request with the new checkpoint
        if: steps.cp.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          SEQ: ${{ steps.cp.outputs.seq }}
          HEAD12: ${{ steps.cp.outputs.head }}
          TOTAL: ${{ steps.cp.outputs.total }}
          SIGNER: ${{ steps.cp.outputs.signer }}
          ISSUER: ${{ steps.cp.outputs.issuer }}
        run: |
          set -euo pipefail
          branch="checkpoint/$(date -u +%Y%m%d)-${SEQ}"
          # the App's own bot identity: the [bot] suffix is what classifies the commit author as a system actor, and the
          # noreply address must use the bot USER id (not the App ID) or the commit loses its verified badge
          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$CHECKPOINTS" .retrace/witnesses.jsonl .retrace/rekor-public.pem
          git commit -m "Checkpoint ${PROJECT} head #${SEQ} ${HEAD12}" \
            -m "Signed head checkpoint from a verified full export (${TOTAL} events, issuer kid ${ISSUER}, checkpoint signer kid ${SIGNER}). Merging this PR is the witness: a later export that no longer contains #${SEQ} with this hash is NOT VALID under verify --checkpoint."
          git push -u origin "$branch"
          {
            printf 'Scheduled head checkpoint for project `%s`: seq **#%s**, head `%s…`, %s events, issuer kid `%s`, checkpoint signer kid `%s`.\n\nMerging records that this head existed now. Verify any later bundle with the committed `.retrace/checkpoint-public.jwk`:\n\n    retrace-export verify <bundle.json> --checkpoint .retrace/checkpoints.jsonl\n\nRetrace-Caused-By: evt_4b37cc72831a4434937b339a1873e27f\n\n### Reconciliation since the previous checkpoint commit\n\n```\n' "$PROJECT" "$SEQ" "$HEAD12" "$TOTAL" "$ISSUER" "$SIGNER"
            cat reconcile.txt 2>/dev/null || echo "reconcile did not run"
            printf '```\n'
          } > pr-body.md
          gh pr create --base main --head "$branch" \
            --title "Checkpoint ${PROJECT} head #${SEQ}" \
            --body-file pr-body.md
      - name: Fail the job if reconciliation found unacknowledged failures
        if: steps.rec.outcome == 'failure'
        run: |
          echo "::error::reconcile reported a missing or mis-attributed commit (see the step output); acknowledge with a correction event or fix the producer" >&2
          exit 1
